<!DOCTYPE html>
<html>
<head>
    <title>Kalyan Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>

<body>

    <h2>Find a Collection Center Near You</h2>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

    

        var map = L.map('map').setView([19.2437, 73.1355], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        L.marker([19.2437, 73.1355])
            .addTo(map)
            .bindPopup("<b>Kalyan, Maharashtra</b>")
            .openPopup();
    </script>

</body>
</html>
